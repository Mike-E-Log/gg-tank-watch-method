<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body { max-width: 46rem; margin: 2rem auto; padding: 0 1.1rem;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #1a1a1a; }
    h1, h2, h3 { line-height: 1.25; } h1 { font-size: 1.7rem; }
    code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; }
    pre { overflow: auto; background: #f6f8fa; padding: 1rem; border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d8dee4; padding: 6px 10px; text-align: left; vertical-align: top; }
    a { color: #0e6e6e; } hr { border: 0; border-top: 1px solid #e2e6ea; margin: 2rem 0; }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
